<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bonvio · Open Graph card (1200×630) — source for /og.png</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Archivo+Mono:wght@500&display=swap">
<!-- build-og.sh replaces the Google Fonts link above with inlined @font-face -->
<style>
  html,body{margin:0;padding:0;background:#1F4332;}
  /* Screenshot #canvas at exactly 1200x630. Regenerate with scripts/build-og.sh */
  #canvas{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:#1F4332;color:#F4F5F4;
    font-family:Archivo,"Segoe UI",system-ui,"DejaVu Sans",Arial,sans-serif;
    padding:66px 80px;box-sizing:border-box;
  }
  #canvas::after{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(244,245,244,0.05) 1px,transparent 1px);
    background-size:5px 5px;pointer-events:none;
  }
  .brandrow{display:flex;align-items:center;gap:14px;position:relative;z-index:1;flex:none;}
  .mark{width:44px;height:44px;border-radius:11px;flex:none;}
  .wordmark{font-size:30px;font-weight:600;letter-spacing:-0.03em;}
  .headline{
    position:relative;z-index:1;margin:150px 0 0;
    font-size:78px;font-weight:700;letter-spacing:-0.04em;line-height:1.02;
    max-width:15ch;text-wrap:balance;
  }
  .addr{
    font-family:"Archivo Mono","DejaVu Sans Mono",ui-monospace,Consolas,monospace;
    font-size:27px;font-weight:500;color:#CDE0D3;letter-spacing:-0.01em;margin-top:22px;
  }
</style>
</head>
<body>
<div id="canvas">
  <div class="brandrow">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#F4F5F4"/><path fill-rule="evenodd" fill="#1F4332" d="M21 17H34A5.5 5.5 0 0 1 39.5 22.5V25.5A5.5 5.5 0 0 1 34 31H36A7 7 0 0 1 43 38V40A7 7 0 0 1 36 47H21ZM27 22H32.5A2.25 2.25 0 0 1 32.5 26.5H27ZM27 31.5H32A5 5 0 0 1 37 36.5V37A5 5 0 0 1 32 42H27Z"/></svg>
    <span class="wordmark">Bonvio</span>
  </div>
  <div>
    <h1 class="headline">Beleg fotografieren. Schicken. Fertig.</h1>
    <div class="addr">bonvio0123@bonvio.eu</div>
  </div>
</div>
</body>
</html>
